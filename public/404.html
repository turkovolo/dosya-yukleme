<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sayfa bulunamadı — Dosya Paylaş</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <div class="shell">
    <header class="brand brand--compact">
      <a class="brand__link" href="/">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m6 10 6-6 6 6"/><path d="M4 20h16"/></svg>
        </span>
        <span class="brand__name">Dosya Paylaş</span>
      </a>
    </header>
    <main class="card error-page">
      <p class="error-code">404</p>
      <h1 class="error-heading">Bağlantı bulunamadı</h1>
      <p class="error-copy">Aradığınız dosya silinmiş veya bağlantı hatalı olabilir. Yeni bir dosya yükleyerek tekrar deneyin.</p>
      <a class="btn btn--primary btn--block" href="/">Yeni Dosya Yükle</a>
    </main>
    <footer class="foot"><p>Dosya Paylaş — hızlı, ücretsiz, kayıt gerektirmez.</p></footer>
  </div>
</body>
</html>
